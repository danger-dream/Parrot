name: Create GHCR Image Alias

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source image ref to copy from"
        required: true
        type: string
      targets:
        description: "Whitespace-separated target image refs"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  alias:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create aliases
        env:
          SOURCE: ${{ inputs.source }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          args=()
          for target in $TARGETS; do
            echo "alias: $target -> $SOURCE"
            args+=("-t" "$target")
          done
          docker buildx imagetools create "${args[@]}" "$SOURCE"
