message WebSearchArgs {
  string search_term = 1;
  string tool_call_id = 2;
}

message WebSearchResult {
  oneof result {
    agent.v1.WebSearchSuccess success = 1;
    agent.v1.WebSearchError error = 2;
    agent.v1.WebSearchRejected rejected = 3;
  }
}

message WebSearchSuccess {
  repeated agent.v1.WebSearchReference references = 1;
}

message WebSearchError {
  string error = 1;
}

message WebSearchRejected {
  string reason = 1;
}

message WebSearchReference {
  string title = 1;
  string url = 2;
  string chunk = 3;
}

message WebSearchToolCall {
  agent.v1.WebSearchArgs args = 1;
  agent.v1.WebSearchResult result = 2;
}

message WebSearchRequestQuery {
  agent.v1.WebSearchArgs args = 1;
}

message WebSearchRequestResponse {
  oneof result {
    agent.v1.WebSearchRequestResponse_Approved approved = 1;
    agent.v1.WebSearchRequestResponse_Rejected rejected = 2;
  }
}

message WebSearchRequestResponse_Approved {
}

message WebSearchRequestResponse_Rejected {
  string reason = 1;
}

message WriteArgs {
  string path = 1;
  string file_text = 2;
  string tool_call_id = 3;
  bool return_file_content_after_write = 4;
  bytes file_bytes = 5;
}

message WriteResult {
  oneof result {
    agent.v1.WriteSuccess success = 1;
    agent.v1.WritePermissionDenied permission_denied = 3;
    agent.v1.WriteNoSpace no_space = 4;
    agent.v1.WriteError error = 5;
    agent.v1.WriteRejected rejected = 6;
  }
}

message WriteSuccess {
  string path = 1;
  int32 lines_created = 2;
  int32 file_size = 3;
  optional string file_content_after_write = 4;
}

message WritePermissionDenied {
  string path = 1;
  string directory = 2;
  string operation = 3;
  string error = 4;
  bool is_readonly = 5;
}

message WriteNoSpace {
  string path = 1;
}

message WriteError {
  string path = 1;
  string error = 2;
}

message WriteRejected {
  string path = 1;
  string reason = 2;
}

message BootstrapStatsigRequest {
  optional bool ignore_dev_status = 1;
  optional int32 operating_system = 2;
}

message PingResponse {
}

message ExecRequest {
  string command = 1;
  optional string cwd = 2;
  repeated string args = 3;
  map<string, string> environment = 4;
}

message ExecResponse {
  oneof event {
    agent.v1.StdoutEvent stdout_event = 1;
    agent.v1.StderrEvent stderr_event = 2;
    agent.v1.ExitEvent exit_event = 3;
  }
}

message StdoutEvent {
  string data = 1;
}

message StderrEvent {
  string data = 1;
}

message ExitEvent {
  int32 exit_code = 1;
}

message ReadTextFileRequest {
  string path = 1;
}

message ReadTextFileResponse {
  string content = 1;
}

message WriteTextFileRequest {
  string path = 1;
  string content = 2;
}

message WriteTextFileResponse {
}

message ReadBinaryFileRequest {
  string path = 1;
}

message ReadBinaryFileResponse {
  bytes content = 1;
}

message WriteBinaryFileRequest {
  string path = 1;
  bytes content = 2;
}

message WriteBinaryFileResponse {
}

message GetWorkspaceChangesHashRequest {
  string root_path = 1;
  string base_ref = 2;
}

message GetWorkspaceChangesHashResponse {
  string hash = 1;
}

message RefreshGithubAccessTokenRequest {
  string github_access_token = 1;
  string hostname = 2;
}

message RefreshGithubAccessTokenResponse {
}

message WarmRemoteAccessServerRequest {
  string commit = 1;
  int32 port = 2;
  string connection_token = 3;
}

message WarmRemoteAccessServerResponse {
}

message ListArtifactsRequest {
}

message ArtifactUploadMetadata {
  string absolute_path = 1;
  uint64 size_bytes = 2;
  int64 updated_at_unix_ms = 3;
  int32 status = 4;
  uint64 bytes_uploaded = 5;
  string last_error = 6;
  uint32 upload_attempts = 7;
  int64 last_started_at_unix_ms = 8;
  int64 last_finished_at_unix_ms = 9;
  string upload_id = 10;
}

message ListArtifactsResponse {
  repeated agent.v1.ArtifactUploadMetadata artifacts = 1;
}

message UploadArtifactsRequest {
  repeated agent.v1.ArtifactUploadInstruction uploads = 1;
}

message ArtifactUploadInstruction {
  string absolute_path = 1;
  string upload_url = 2;
  string method = 3;
  map<string, string> headers = 4;
  optional string content_type = 5;
  optional string slack_upload_url = 6;
  optional string slack_file_id = 7;
}

message ArtifactUploadDispatchResult {
  string absolute_path = 1;
  int32 status = 2;
  string message = 3;
  optional string slack_file_id = 4;
}

message UploadArtifactsResponse {
  repeated agent.v1.ArtifactUploadDispatchResult results = 1;
}

message GetMcpRefreshTokensRequest {
}

message GetMcpRefreshTokensResponse {
  map<string, string> refresh_tokens = 1;
}

message UpdateEnvironmentVariablesRequest {
  map<string, string> env = 1;
  bool replace = 2;
}

message UpdateEnvironmentVariablesResponse {
  uint32 applied = 1;
  uint32 removed = 2;
}

message McpOAuthStoredData {
  string refresh_token = 1;
  string client_id = 2;
  optional string client_secret = 3;
  repeated string redirect_uris = 4;
}

message Frame {
  string id = 1;
  string method = 2;
  bytes data = 3;
  int32 kind = 4;
  string error = 5;
}

message Empty {
}

message BidiRequestId {
  string request_id = 1;
}

service AgentService {
  rpc Run (agent.v1.AgentClientMessage) returns (agent.v1.AgentServerMessage);
  rpc RunSSE (agent.v1.BidiRequestId) returns (agent.v1.AgentServerMessage);
  rpc NameAgent (agent.v1.NameAgentRequest) returns (agent.v1.NameAgentResponse);
  rpc GetUsableModels (agent.v1.GetUsableModelsRequest) returns (agent.v1.GetUsableModelsResponse);
  rpc GetDefaultModelForCli (agent.v1.GetDefaultModelForCliRequest) returns (agent.v1.GetDefaultModelForCliResponse);
  rpc GetAllowedModelIntents (agent.v1.GetAllowedModelIntentsRequest) returns (agent.v1.GetAllowedModelIntentsResponse);
}

service ControlService {
  rpc ReadTextFile (agent.v1.ReadTextFileRequest) returns (agent.v1.ReadTextFileResponse);
  rpc WriteTextFile (agent.v1.WriteTextFileRequest) returns (agent.v1.WriteTextFileResponse);
  rpc ReadBinaryFile (agent.v1.ReadBinaryFileRequest) returns (agent.v1.ReadBinaryFileResponse);
  rpc WriteBinaryFile (agent.v1.WriteBinaryFileRequest) returns (agent.v1.WriteBinaryFileResponse);
  rpc GetWorkspaceChangesHash (agent.v1.GetWorkspaceChangesHashRequest) returns (agent.v1.GetWorkspaceChangesHashResponse);
  rpc RefreshGithubAccessToken (agent.v1.RefreshGithubAccessTokenRequest) returns (agent.v1.RefreshGithubAccessTokenResponse);
  rpc WarmRemoteAccessServer (agent.v1.WarmRemoteAccessServerRequest) returns (agent.v1.WarmRemoteAccessServerResponse);
  rpc ListArtifacts (agent.v1.ListArtifactsRequest) returns (agent.v1.ListArtifactsResponse);
  rpc UploadArtifacts (agent.v1.UploadArtifactsRequest) returns (agent.v1.UploadArtifactsResponse);
  rpc GetMcpRefreshTokens (agent.v1.GetMcpRefreshTokensRequest) returns (agent.v1.GetMcpRefreshTokensResponse);
  rpc UpdateEnvironmentVariables (agent.v1.UpdateEnvironmentVariablesRequest) returns (agent.v1.UpdateEnvironmentVariablesResponse);
}

service ExecService {
}

service PrivateWorkerBridgeExternalService {
  rpc Connect (agent.v1.Frame) returns (agent.v1.Frame);
}

service LifecycleService {
  rpc ResetInstance (agent.v1.Empty) returns (agent.v1.Empty);
  rpc RenewInstance (agent.v1.Empty) returns (agent.v1.Empty);
}
