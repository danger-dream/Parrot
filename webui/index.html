<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="16x16" href="./src/assets/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./src/assets/brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="./src/assets/brand/apple-touch-icon.png" />
    <title>Parrot</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('parrot.theme') || 'auto'
          var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
